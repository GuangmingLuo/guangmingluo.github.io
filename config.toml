baseurl = "https://guangmingluo.github.io/"
title = "Guangming Blog"
theme = "hugo-theme-cleanwhite"
languageCode = "zh-cn"
# Google Analytics (new config format)
[services.googleAnalytics]
  id = "G-TDZ7Y74PRC"
preserveTaxonomyNames = true
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true

[pagination]
pagerSize = 5

[outputs]
home = ["HTML", "RSS"]

[params]
  header_image = "img/bg/home-bg-mars.jpeg"
  SEOTitle = "罗广明的博客 | Luoguangming Blog"
  description = "罗广明, 开源爱好者，旅行探险家 | 这里是 罗广明 的博客，与你一起发现更大的世界。"
  keyword = "罗广明, Guangming, LuoGuangming, 罗广明的网络日志, 罗广明的博客, Guangming Blog, 博客, 个人网站, 互联网, Web, 云原生, Istio, RPC, 微服务, Microservice, CloudWeGo, 每日科技早报"
  slogan = "路在脚下，心向远方"

  image_404 = "img/bg/404-bg.jpg"
  title_404 = "你来到了没有知识的荒原 :("
  omit_categories = true

  # leancloud storage for page view counter
  page_view_conter = false 
  leancloud_app_id = ""
  leancloud_app_key = ""

  # algolia site search (disabled - no valid credentials)
  algolia_search = false
  algolia_appId = ""
  algolia_indexName = ""
  algolia_apiKey = ""

  # Sidebar settings
  sidebar_about_description = "Software Architect, Open Source Enthusiast and Life Adventurer"
  sidebar_avatar = "img/luoguangming-2.jpeg"      # use absolute URL, seeing it's used in both `/` and `/about/`

  featured_tags = true 
  featured_condition_size = 1 

  # Baidu Analytics
  ba_track_id = ""

  # Twikoo comments
  twikoo_env_id = ""

  #Enable wechat pay & alipay to allow readers send reward money if they like the articles
  reward = true
  reward_guide = "如果这篇文章对你有帮助，欢迎赞赏支持我的创作" 

  friends = true
  bookmarks = false
  about_me = true

  # Twitter handle (without @)
  twitter = "IvanLuo10"

  # Include any custom CSS and/or JS files, url or relative to /static folder
  #custom_css = ["css/lightbox.css", "https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css", "css/main.css"]
  #custom_js = ["js/lightbox.js", "https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js", "js/main.js"]

  [params.social]
  rss            = true 
  email          = "guangmingluo1994@gmail.com"
  twitter       = "https://twitter.com/IvanLuo10"
  linkedin       = "https://www.linkedin.com/in/guangmingluo1994/"
  github         = "https://github.com/GuangmingLuo"
  wechat         = "/img/lgm-wechat.jpeg"
  
  [[params.friend_link]]
  title = "云原生社区"
  href =  "https://cloudnative.to/"
  [[params.friend_link]]
  title = "Jimmy Song"
  href =  "https://jimmysong.io/"

  [[params.addtional_menus]]
  title =  "DAILY"
  href =  "/daily-news"
  [[params.addtional_menus]]
  title =  "ARCHIVE"
  href =  "/archive"
  [[params.addtional_menus]]
  title =  "NOTES"
  href =  "/notes"
  [[params.addtional_menus]]
  title =  "ABOUT"
  href =  "/about"

[markup]
  [markup.tableOfContents]
    endLevel = 2
    startLevel = 1
  [markup.highlight]
    style = "dracula"
